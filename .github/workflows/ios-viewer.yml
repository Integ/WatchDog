name: iOS Viewer

on:
  push:
    paths:
      - ".github/workflows/ios-viewer.yml"
      - "ios/WatchDogViewer/**"
      - "docs/IOS_VIEWER.md"
  pull_request:
    paths:
      - ".github/workflows/ios-viewer.yml"
      - "ios/WatchDogViewer/**"
      - "docs/IOS_VIEWER.md"
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        required: true
        default: "validate-only"
        type: choice
        options:
          - validate-only
          - hosted-modern-build
          - self-hosted-legacy-build

jobs:
  validate:
    name: Validate iOS project
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Lint plist files
        run: |
          plutil -lint ios/WatchDogViewer/WatchDogViewer/Info.plist
          plutil -lint ios/WatchDogViewer/WatchDogViewer.xcodeproj/project.pbxproj

      - name: Inspect project
        run: |
          xcodebuild \
            -project ios/WatchDogViewer/WatchDogViewer.xcodeproj \
            -list

  hosted-modern-build:
    name: Modern hosted Xcode smoke build
    runs-on: macos-15
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'hosted-modern-build'
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build with hosted Xcode
        run: |
          xcodebuild \
            -project ios/WatchDogViewer/WatchDogViewer.xcodeproj \
            -target WatchDogViewer \
            -configuration Debug \
            -sdk iphonesimulator \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            build

  self-hosted-legacy-build:
    name: Legacy iOS 6 armv7 build
    runs-on: [self-hosted, macOS, xcode-legacy]
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'self-hosted-legacy-build'
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build unsigned iOS 6 armv7 app
        run: |
          xcodebuild \
            -project ios/WatchDogViewer/WatchDogViewer.xcodeproj \
            -target WatchDogViewer \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=armv7 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=6.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchDogViewer-legacy-ios6-unsigned
          path: |
            build/Release-iphoneos/WatchDogViewer.app
